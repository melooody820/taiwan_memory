<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我们的旅行日记 ♡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=VT323&display=swap" rel="stylesheet" />
<style>
  :root{
    --pink:#ff8fb8; --pink-deep:#ff5c98; --pink-light:#ffd6e6; --pink-pale:#fff0f6;
    --white:#fffdfd; --ink:#6b3550; --border:#ffb9d4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"ZCOOL KuaiLe","VT323","Comic Sans MS","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 18%, #ffe3ef 0 60px, transparent 61px),
      radial-gradient(circle at 88% 12%, #ffe3ef 0 40px, transparent 41px),
      radial-gradient(circle at 85% 85%, #ffe9f3 0 70px, transparent 71px),
      repeating-linear-gradient(0deg, #fff6fa 0 28px, #ffedf5 28px 29px),
      repeating-linear-gradient(90deg, transparent 0 28px, rgba(255,182,212,.25) 28px 29px);
    background-color:#fff6fa;
    padding-bottom:80px;
  }
  a{color:var(--pink-deep);}
  /* ====== 像素风通用件 ====== */
  .pixel-box{
    background:var(--white);
    border:3px solid var(--pink);
    box-shadow:4px 4px 0 var(--pink-light);
    border-radius:2px;
    padding:16px;
  }
  .btn{
    font-family:inherit; font-size:15px; cursor:pointer;
    background:var(--pink); color:#fff; border:3px solid var(--pink-deep);
    box-shadow:3px 3px 0 var(--pink-light); border-radius:2px;
    padding:6px 16px; transition:transform .05s;
  }
  .btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--pink-light);}
  .btn.ghost{background:var(--white); color:var(--pink-deep);}
  .btn.small{font-size:13px; padding:3px 10px;}
  input[type=text],textarea,select{
    font-family:inherit; font-size:15px; width:100%;
    border:3px solid var(--border); background:var(--white); color:var(--ink);
    padding:8px 10px; border-radius:2px; outline:none;
  }
  input:focus,textarea:focus{border-color:var(--pink-deep);}
  textarea{min-height:180px; resize:vertical; line-height:1.8;}
  .tag{display:inline-block;background:var(--pink-pale);border:2px solid var(--border);
       padding:1px 8px;font-size:13px;margin:2px;}
  /* ====== 顶部 ====== */
  header.site{
    text-align:center; padding:26px 12px 10px;
  }
  .site-title{
    display:inline-block; font-size:clamp(26px,5.5vw,44px); letter-spacing:2px;
    background:var(--white); border:3px solid var(--pink-deep);
    box-shadow:5px 5px 0 var(--pink-light); padding:10px 26px; position:relative;
  }
  .site-title .star{position:absolute; font-size:18px; color:var(--pink-deep);
    animation:blink 1s steps(2) infinite;}
  .site-title .star.l{left:8px; top:6px;} .site-title .star.r{right:8px; bottom:6px;}
  @keyframes blink{50%{opacity:0;}}
  .marquee-wrap{
    margin:14px auto 0; max-width:720px; overflow:hidden;
    border-top:2px dashed var(--border); border-bottom:2px dashed var(--border);
    background:var(--pink-pale);
  }
  .marquee{display:inline-block; white-space:nowrap; padding:6px 0; font-size:15px;
    animation:scroll 18s linear infinite;}
  @keyframes scroll{from{transform:translateX(45%);}to{transform:translateX(-100%);}}
  /* ====== 布局 ====== */
  main{max-width:860px; margin:18px auto; padding:0 14px;}
  .nav{display:flex; gap:10px; justify-content:center; margin:14px 0 20px; flex-wrap:wrap;}
  .crumb{font-size:14px; margin-bottom:12px; color:#a05f7e;}
  .crumb a{text-decoration:none;}
  /* ====== 文件夹 ====== */
  .folders{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px;}
  .folder{
    cursor:pointer; text-align:center; padding:14px 8px 12px; position:relative;
    background:var(--white); border:3px solid var(--pink); box-shadow:4px 4px 0 var(--pink-light);
    transition:transform .08s;
  }
  .folder:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--pink-light);}
  .folder::before{
    content:""; display:block; height:10px; width:52%; margin:-14px auto 8px 8px;
    background:var(--pink-light); border:3px solid var(--pink); border-bottom:none;
  }
  .folder .icon{font-size:34px; line-height:1.2;}
  .folder .name{margin-top:6px; font-size:16px; word-break:break-all;}
  .folder .count{font-size:12px; color:#b47490;}
  .folder.add{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-style:dashed; color:var(--pink-deep); min-height:110px;
  }
  .folder.add::before{display:none;}
  .folder.add .plus{font-size:34px;}
  /* ====== 攻略卡片 ====== */
  .guide-list{display:flex; flex-direction:column; gap:14px;}
  .guide-card{display:flex; gap:12px; align-items:flex-start; cursor:pointer;}
  .guide-card .thumb{
    width:84px; height:84px; flex:none; object-fit:cover;
    border:3px solid var(--border); background:var(--pink-pale);
  }
  .guide-card .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:28px;}
  .guide-card h3{font-size:18px; color:var(--pink-deep);}
  .guide-card .meta{font-size:13px; color:#a05f7e; margin:4px 0 4px;}
  .guide-card .snippet{font-size:14px; color:#7d4a61; line-height:1.6;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  /* ====== 攻略详情 ====== */
  .guide-body h2{font-size:24px; color:var(--pink-deep); margin-bottom:6px;}
  .guide-body .meta{font-size:13px; color:#a05f7e; margin-bottom:14px;}
  .guide-body .text{white-space:pre-wrap; line-height:2; font-size:16px;}
  .photos{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin:14px 0;}
  .photos img{width:100%; border:3px solid var(--border); cursor:zoom-in; background:var(--pink-pale);}
  /* 评论 */
  .comments h3{margin:22px 0 10px; color:var(--pink-deep);}
  .comment{border-left:4px solid var(--pink-light); background:var(--pink-pale);
    padding:8px 12px; margin-bottom:10px; font-size:14px;}
  .comment b{color:var(--pink-deep);}
  .comment .time{font-size:12px; color:#b48aa0; margin-left:6px;}
  .comment-form{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .comment-form textarea{min-height:70px;}
  /* ====== 上传 ====== */
  .upload-zone{border:3px dashed var(--border); padding:14px; text-align:center;
    background:var(--pink-pale); cursor:pointer; font-size:14px;}
  .upload-zone:hover{border-color:var(--pink-deep);}
  .progress{height:14px; border:2px solid var(--border); margin-top:8px; display:none;}
  .progress .bar{height:100%; width:0%; background:repeating-linear-gradient(45deg,var(--pink) 0 8px,var(--pink-deep) 8px 16px);}
  .preview-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .preview-row .pv{position:relative;}
  .preview-row img{width:72px;height:72px;object-fit:cover;border:2px solid var(--border);}
  .preview-row .del{position:absolute;top:-8px;right:-8px;width:20px;height:20px;line-height:16px;
    text-align:center;background:var(--pink-deep);color:#fff;border:2px solid #fff;cursor:pointer;font-size:12px;border-radius:50%;}
  /* ====== 收藏夹 ====== */
  .link-list{display:flex;flex-direction:column;gap:10px;}
  .link-card{display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .link-card a{font-size:16px;text-decoration:none;}
  .link-card .note{font-size:13px;color:#a05f7e;}
  /* ====== 照片空位 ====== */
  .photo-slot{
    border:3px dashed var(--pink); background:rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:#c27495; font-size:14px; line-height:1.6; padding:18px;
  }
  .hero-slots{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px;}
  @media (max-width:560px){.hero-slots{grid-template-columns:1fr;}}
  /* ====== 弹窗 ====== */
  .modal-mask{position:fixed; inset:0; background:rgba(107,53,80,.35); display:none;
    align-items:center; justify-content:center; z-index:50;}
  .modal-mask.show{display:flex;}
  .modal{width:min(92vw,380px);}
  .modal h3{color:var(--pink-deep); margin-bottom:12px;}
  .modal .row{display:flex; gap:10px; justify-content:flex-end; margin-top:14px;}
  .toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    background:var(--pink-deep); color:#fff; padding:8px 18px; border:3px solid #fff;
    box-shadow:3px 3px 0 var(--pink-light); display:none; z-index:60; font-size:15px;}
  .empty{color:#c27495; text-align:center; padding:30px 0; font-size:15px;}
  .spin{text-align:center; padding:26px; color:var(--pink-deep);}
  .footer{text-align:center; font-size:12px; color:#c89cae; margin-top:40px;}
  .viewer{position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; z-index:70;
    align-items:center; justify-content:center; cursor:zoom-out;}
  .viewer.show{display:flex;} .viewer img{max-width:94vw; max-height:92vh; border:4px solid #fff;}
</style>
</head>
<body>

<header class="site">
  <div class="site-title">
    <span class="star l">✦</span>
    ✈ 我们的旅行日记 ♡
    <span class="star r">✦</span>
  </div>
  <div class="marquee-wrap">
    <span class="marquee">♡ 欢迎来到我们的秘密基地，让我们一起探寻世界的各个角落 ♡ ✈ 🌍 📷 🍜 🎡 ♡</span>
  </div>
</header>

<nav class="nav">
  <button class="btn ghost" data-nav="home">🏠 首页</button>
  <button class="btn ghost" data-nav="fav">🔗 网络攻略收藏夹</button>
</nav>

<main id="app"><div class="spin">加载中…♡</div></main>

<div class="footer">made with ♡ · 我们的旅行日记 · under construction…</div>

<!-- 通用输入弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal pixel-box">
    <h3 id="modalTitle">新建</h3>
    <input type="text" id="modalInput" placeholder="输入名字…" maxlength="30" />
    <div class="row">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn" id="modalOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="viewer" id="viewer"><img id="viewerImg" alt="" /></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
/* ================= 配置（已填好，勿改） ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBm1za_HNQK_ggQAkkUDuQOjdrYUQG15bI",
  authDomain: "eleveennn11.firebaseapp.com",
  projectId: "eleveennn11",
  storageBucket: "eleveennn11.firebasestorage.app",
  messagingSenderId: "416641076296",
  appId: "1:416641076296:web:7a1f19b83dcb5a65d85c7d"
};
const cloudinaryConfig = { cloudName: "lvlzjnib", uploadPreset: "Eleven" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= 工具 ================= */
const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
function esc(s){return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtTime(ts){ if(!ts) return ""; const d=new Date(ts); const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block";
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display="none",1800); }
function cdnUrl(url){
  if(!/res\.cloudinary\.com/i.test(url||"")) return url||"";
  return url.replace("/upload/", "/upload/f_auto,q_auto/");
}
function askName(title, placeholder){
  return new Promise(resolve=>{
    const mask=$("#modal"); $("#modalTitle").textContent=title;
    const input=$("#modalInput"); input.value=""; input.placeholder=placeholder||"";
    mask.classList.add("show"); setTimeout(()=>input.focus(),50);
    const done=v=>{ mask.classList.remove("show"); $("#modalOk").onclick=null; $("#modalCancel").onclick=null; mask.onclick=null; input.onkeydown=null; resolve(v); };
    $("#modalOk").onclick=()=>{ const v=input.value.trim(); if(v) done(v); else toast("名字不能为空哦"); };
    $("#modalCancel").onclick=()=>done(null);
    mask.onclick=e=>{ if(e.target===mask) done(null); };
    input.onkeydown=e=>{ if(e.key==="Enter") $("#modalOk").click(); if(e.key==="Escape") done(null); };
  });
}

/* ================= 首次种子数据 ================= */
async function seedIfEmpty(){
  const snap = await db.collection("countries").limit(1).get();
  if(!snap.empty) return;
  const now = Date.now();
  const jp = await db.collection("countries").add({ name:"日本", icon:"🇯🇵", createdAt: now });
  await db.collection("cities").add({ countryId: jp.id, name:"东京", icon:"🗼", createdAt: now+1 });
  await db.collection("cities").add({ countryId: jp.id, name:"大阪", icon:"🏯", createdAt: now+2 });
  const uk = await db.collection("countries").add({ name:"英国", icon:"🇬🇧", createdAt: now+3 });
  await db.collection("cities").add({ countryId: uk.id, name:"伦敦", icon:"🎡", createdAt: now+4 });
  const cn = await db.collection("countries").add({ name:"中国", icon:"🇨🇳", createdAt: now+5 });
  await db.collection("cities").add({ countryId: cn.id, name:"台北", icon:"🥭", createdAt: now+6 });
}

/* ================= 路由 ================= */
window.addEventListener("hashchange", render);
document.addEventListener("click", e=>{
  const nav = e.target.closest("[data-nav]");
  if(nav){ location.hash = nav.dataset.nav==="fav" ? "#/fav" : "#/"; }
});
$("#viewer").addEventListener("click", ()=>$("#viewer").classList.remove("show"));

async function render(){
  const hash = location.hash || "#/";
  const parts = hash.slice(2).split("/").filter(Boolean);
  app.innerHTML = '<div class="spin">加载中…♡</div>';
  try{
    if(parts[0]==="fav") return renderFav();
    if(parts[0]==="country" && parts[1]) return renderCountry(parts[1]);
    if(parts[0]==="city" && parts[1]) return renderCity(parts[1]);
    if(parts[0]==="guide" && parts[1]) return renderGuide(parts[1]);
    if(parts[0]==="edit" && parts[1]) return renderEdit(parts[1], null);
    if(parts[0]==="new" && parts[1]) return renderEdit(null, parts[1]);
    return renderHome();
  }catch(err){
    console.error(err);
    app.innerHTML = '<div class="pixel-box empty">出错了：'+esc(err.message)+'<br><br><a href="#/">← 回首页</a></div>';
  }
}

/* ================= 首页 ================= */
async function renderHome(){
  const snap = await db.collection("countries").orderBy("createdAt","asc").get();
  const countries = snap.docs.map(d=>({id:d.id,...d.data()}));
  if(!countries.length) await seedIfEmpty();
  const snap2 = countries.length ? null : await db.collection("countries").orderBy("createdAt","asc").get();
  const list = countries.length ? countries : snap2.docs.map(d=>({id:d.id,...d.data()}));

  const cityCounts = {};
  const cs = await db.collection("cities").get();
  cs.docs.forEach(d=>{ const c=d.data().countryId; cityCounts[c]=(cityCounts[c]||0)+1; });

  app.innerHTML = `
    <div class="pixel-box" style="margin-bottom:16px;">
      <div style="font-size:15px; line-height:1.9; text-align:center;">
        ♡ 点进一个国家文件夹，再点进城市，就能看到大家写的攻略 ♡<br/>
        <span style="font-size:13px;color:#b47490;">每个人都可以在城市里上传自己的攻略，也可以在攻略下面留言</span>
      </div>
    </div>

    <div class="folders" id="folderGrid">
      ${list.map(c=>`
        <div class="folder" data-id="${c.id}">
          <div class="icon">${esc(c.icon||"📁")}</div>
          <div class="name">${esc(c.name)}</div>
          <div class="count">${cityCounts[c.id]||0} 个城市</div>
        </div>`).join("")}
      <div class="folder add" id="addCountry"><div class="plus">＋</div><div>新建国家</div></div>
    </div>

    <div class="hero-slots" style="margin-top:22px;">
      <div class="photo-slot">📸 空位 A<br/>这里放你们的合照（横图）</div>
      <div class="photo-slot">🌸 空位 B<br/>这里放可爱的照片 / 贴纸</div>
    </div>
  `;
  $("#folderGrid").addEventListener("click", e=>{
    const f = e.target.closest(".folder");
    if(!f || f.id==="addCountry") return;
    location.hash = "#/country/"+f.dataset.id;
  });
  $("#addCountry").onclick = async ()=>{
    const name = await askName("新建一个国家文件夹","比如：韩国 / 泰国 / 法国");
    if(!name) return;
    const icon = await askName("给它配一个图标（emoji）","比如：🇰🇷 / 🌴 / 🥐（直接粘贴 emoji）");
    await db.collection("countries").add({ name, icon: icon||"📁", createdAt: Date.now() });
    toast("建好啦 ♡"); renderHome();
  };
}

/* ================= 国家页（城市列表） ================= */
async function renderCountry(id){
  const doc = await db.collection("countries").doc(id).get();
  if(!doc.exists){ location.hash="#/"; return; }
  const country = { id: doc.id, ...doc.data() };
  const snap = await db.collection("cities").where("countryId","==",id).orderBy("createdAt","asc").get();
  const cities = snap.docs.map(d=>({id:d.id,...d.data()}));
  const guideCounts = {};
  const gs = await db.collection("guides").where("countryId","==",id).get();
  gs.docs.forEach(d=>{ const c=d.data().cityId; guideCounts[c]=(guideCounts[c]||0)+1; });

  app.innerHTML = `
    <div class="crumb"><a href="#/">🏠 首页</a> / ${esc(country.icon||"")} ${esc(country.name)}</div>
    <div class="folders">
      ${cities.map(c=>`
        <div class="folder" data-id="${c.id}">
          <div class="icon">${esc(c.icon||"📍")}</div>
          <div class="name">${esc(c.name)}</div>
          <div class="count">${guideCounts[c.id]||0} 篇攻略</div>
        </div>`).join("")}
      <div class="folder add" id="addCity"><div class="plus">＋</div><div>新建城市</div></div>
    </div>
  `;
  app.querySelector(".folders").addEventListener("click", e=>{
    const f = e.target.closest(".folder");
    if(!f || f.id==="addCity") return;
    location.hash = "#/city/"+f.dataset.id;
  });
  $("#addCity").onclick = async ()=>{
    const name = await askName("在「"+country.name+"」里新建一个城市","比如：京都 / 曼彻斯特");
    if(!name) return;
    const icon = await askName("配一个图标（emoji）","比如：⛩️ / 🌊");
    await db.collection("cities").add({ countryId:id, name, icon: icon||"📍", createdAt: Date.now() });
    toast("建好啦 ♡"); renderCountry(id);
  };
}

/* ================= 城市页（攻略列表） ================= */
async function renderCity(id){
  const cityDoc = await db.collection("cities").doc(id).get();
  if(!cityDoc.exists){ location.hash="#/"; return; }
  const city = { id: cityDoc.id, ...cityDoc.data() };
  const cDoc = await db.collection("countries").doc(city.countryId).get();
  const country = cDoc.exists ? { id:cDoc.id, ...cDoc.data() } : { name:"", icon:"" };
  const snap = await db.collection("guides").where("cityId","==",id).get();
  const guides = snap.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  app.innerHTML = `
    <div class="crumb"><a href="#/">🏠 首页</a> / <a href="#/country/${country.id}">${esc(country.icon||"")} ${esc(country.name)}</a> / ${esc(city.icon||"")} ${esc(city.name)}</div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="font-size:15px;">${esc(city.icon||"")} ${esc(city.name)} · 共 ${guides.length} 篇攻略</span>
      <button class="btn" id="newGuide">✏️ 写攻略</button>
    </div>
    <div class="guide-list">
      ${guides.length ? guides.map(g=>`
        <div class="guide-card pixel-box" data-id="${g.id}">
          ${g.images && g.images.length
            ? `<img class="thumb" src="${esc(cdnUrl(g.images[0]))}" loading="lazy" alt=""/>`
            : `<div class="thumb ph">📝</div>`}
          <div>
            <h3>${esc(g.title)}</h3>
            <div class="meta">by ${esc(g.author||"匿名")} · ${fmtTime(g.createdAt)}</div>
            <div class="snippet">${esc((g.content||"").slice(0,80))}</div>
          </div>
        </div>`).join("")
        : `<div class="pixel-box empty">这里还没有攻略，来做第一个写的人吧 ♡</div>`}
    </div>
  `;
  app.querySelector(".guide-list").addEventListener("click", e=>{
    const card = e.target.closest(".guide-card");
    if(card) location.hash = "#/guide/"+card.dataset.id;
  });
  $("#newGuide").onclick = ()=> location.hash = "#/new/"+id;
}

/* ================= 写攻略 / 编辑攻略 ================= */
async function renderEdit(guideId, cityId){
  let guide = null, city = null;
  if(guideId){
    const d = await db.collection("guides").doc(guideId).get();
    if(!d.exists){ location.hash="#/"; return; }
    guide = { id:d.id, ...d.data() };
    cityId = guide.cityId;
  }
  const cd = await db.collection("cities").doc(cityId).get();
  city = { id: cd.id, ...cd.data() };
  const cDoc = await db.collection("countries").doc(city.countryId).get();
  const country = cDoc.exists ? cDoc.data().name : "";
  let images = guide ? (guide.images||[]).slice() : [];

  app.innerHTML = `
    <div class="crumb"><a href="#/city/${cityId}">← 返回 ${esc(city.name)}</a></div>
    <div class="pixel-box">
      <h3 style="color:var(--pink-deep); margin-bottom:12px;">${guide ? "编辑攻略" : "写新攻略"} · ${esc(country)} / ${esc(city.name)}</h3>
      <div style="display:grid; gap:10px;">
        <input type="text" id="gTitle" placeholder="攻略标题，比如：东京 3 天 2 夜逛吃路线" maxlength="60" value="${esc(guide?.title||"")}"/>
        <input type="text" id="gAuthor" placeholder="你的昵称（谁写的就写谁）" maxlength="20" value="${esc(guide?.author||"")}"/>
        <textarea id="gContent" placeholder="正文写这里：行程、交通、住宿、美食、注意事项……换行会原样保留">${esc(guide?.content||"")}</textarea>
        <div class="upload-zone" id="uploadZone">📷 点这里添加照片（最多 9 张）<div class="progress" id="prog"><div class="bar" id="progBar"></div></div></div>
        <input type="file" id="fileInput" accept="image/*" multiple hidden/>
        <div class="preview-row" id="previewRow"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button class="btn ghost" id="cancelBtn">取消</button>
          <button class="btn" id="saveBtn">${guide ? "保存修改" : "发布攻略 ♡"}</button>
        </div>
      </div>
    </div>
  `;

  const row = $("#previewRow");
  function drawPreviews(){
    row.innerHTML = images.map((u,i)=>`
      <div class="pv"><img src="${esc(cdnUrl(u))}"/><span class="del" data-i="${i}">×</span></div>`).join("");
  }
  drawPreviews();
  row.addEventListener("click", e=>{
    const del = e.target.closest(".del");
    if(del){ images.splice(Number(del.dataset.i),1); drawPreviews(); }
  });

  const zone = $("#uploadZone"), input = $("#fileInput");
  zone.onclick = ()=> input.click();
  input.addEventListener("change", async ()=>{
    const files = [...input.files].slice(0, 9 - images.length);
    input.value = "";
    for(const file of files){
      try{
        const url = await uploadToCloudinary(file, (loaded,total)=>{
          const bar=$("#progBar"); $("#prog").style.display="block";
          bar.style.width = total ? Math.round(loaded/total*100)+"%" : "0%";
        });
        images.push(url); drawPreviews();
      }catch(err){ toast("有张照片传失败了："+err.message); }
    }
    $("#prog").style.display="none";
  });

  $("#cancelBtn").onclick = ()=> history.back();
  $("#saveBtn").onclick = async ()=>{
    const title = $("#gTitle").value.trim();
    const author = $("#gAuthor").value.trim() || "匿名";
    const content = $("#gContent").value.trim();
    if(!title) return toast("先写个标题吧");
    if(!content && !images.length) return toast("内容还是空的呢");
    const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "保存中…";
    try{
      if(guide){
        await db.collection("guides").doc(guide.id).update({ title, author, content, images, updatedAt: Date.now() });
        toast("已保存 ♡"); location.hash = "#/guide/"+guide.id;
      }else{
        const ref = await db.collection("guides").add({
          title, author, content, images,
          cityId: cityId, countryId: city.countryId,
          createdAt: Date.now(), updatedAt: Date.now()
        });
        toast("发布成功 ♡"); location.hash = "#/guide/"+ref.id;
      }
    }catch(err){ btn.disabled=false; btn.textContent="发布攻略 ♡"; toast("保存失败："+err.message); }
  };
}

/* ================= 攻略详情 + 评论 ================= */
async function renderGuide(id){
  const d = await db.collection("guides").doc(id).get();
  if(!d.exists){ location.hash="#/"; return; }
  const g = { id:d.id, ...d.data() };
  const cd = await db.collection("cities").doc(g.cityId).get();
  const city = cd.exists ? cd.data().name : "";
  const cs = await db.collection("comments").where("guideId","==",id).get();
  const comments = cs.docs.map(x=>({id:x.id,...x.data()}))
    .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));

  app.innerHTML = `
    <div class="crumb"><a href="#/city/${g.cityId}">← 返回 ${esc(city)}</a></div>
    <div class="pixel-box guide-body">
      <h2>${esc(g.title)}</h2>
      <div class="meta">by ${esc(g.author||"匿名")} · ${fmtTime(g.createdAt)}${g.updatedAt && g.updatedAt!==g.createdAt ? "（编辑于 "+fmtTime(g.updatedAt)+"）" : ""}</div>
      ${g.images && g.images.length ? `<div class="photos">${g.images.map(u=>`<img src="${esc(cdnUrl(u))}" loading="lazy" alt=""/>`).join("")}</div>` : ""}
      <div class="text">${esc(g.content||"")}</div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn small ghost" id="editBtn">✏️ 编辑</button>
        <button class="btn small ghost" id="delBtn">🗑 删除</button>
      </div>
    </div>

    <div class="comments pixel-box" style="margin-top:16px;">
      <h3>💬 留言（${comments.length}）</h3>
      ${comments.length ? comments.map(c=>`
        <div class="comment"><b>${esc(c.name)}</b><span class="time">${fmtTime(c.createdAt)}</span><br/>${esc(c.text)}</div>`).join("")
        : '<div class="empty" style="padding:12px 0;">还没有留言，来抢沙发 ♡</div>'}
      <div class="comment-form">
        <input type="text" id="cName" placeholder="你的昵称" maxlength="20"/>
        <textarea id="cText" placeholder="觉得这篇攻略怎么样？有什么要补充的？"></textarea>
        <div style="text-align:right;"><button class="btn" id="cSend">留言 ♡</button></div>
      </div>
    </div>
  `;

  app.querySelectorAll(".photos img").forEach(img=>{
    img.onclick = ()=>{ $("#viewerImg").src = img.src.replace("/upload/f_auto,q_auto/","/upload/"); $("#viewer").classList.add("show"); };
  });
  $("#editBtn").onclick = ()=> location.hash = "#/edit/"+id;
  $("#delBtn").onclick = async ()=>{
    if(!confirm("确定要删除这篇攻略吗？找不回来哦")) return;
    await db.collection("guides").doc(id).delete();
    toast("已删除"); history.back();
  };
  $("#cSend").onclick = async ()=>{
    const name = $("#cName").value.trim() || "路人";
    const text = $("#cText").value.trim();
    if(!text) return toast("写点什么再发吧");
    await db.collection("comments").add({ guideId:id, name, text, createdAt: Date.now() });
    toast("留言成功 ♡"); renderGuide(id);
  };
}

/* ================= 网络攻略收藏夹 ================= */
async function renderFav(){
  const snap = await db.collection("links").orderBy("createdAt","desc").get();
  const links = snap.docs.map(d=>({id:d.id,...d.data()}));
  app.innerHTML = `
    <div class="crumb"><a href="#/">🏠 首页</a> / 🔗 网络攻略收藏夹</div>
    <div class="pixel-box" style="margin-bottom:14px;">
      <h3 style="color:var(--pink-deep); margin-bottom:10px;">＋ 收藏一个链接</h3>
      <div style="display:grid; gap:8px;">
        <input type="text" id="lTitle" placeholder="标题，比如：小红书 · 大阪环球影城攻略" maxlength="60"/>
        <input type="text" id="lUrl" placeholder="链接 https://…"/>
        <input type="text" id="lNote" placeholder="备注（可选）" maxlength="60"/>
        <div style="text-align:right;"><button class="btn" id="lAdd">收藏 ♡</button></div>
      </div>
    </div>
    <div class="link-list">
      ${links.length ? links.map(l=>`
        <div class="link-card pixel-box">
          <div>
            <a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.title)}</a>
            ${l.note ? `<div class="note">${esc(l.note)}</div>` : ""}
          </div>
          <button class="btn small ghost" data-del="${l.id}">删</button>
        </div>`).join("")
        : '<div class="pixel-box empty">还没有收藏，看到好攻略就贴进来 ♡</div>'}
    </div>
  `;
  $("#lAdd").onclick = async ()=>{
    const title = $("#lTitle").value.trim();
    const url = $("#lUrl").value.trim();
    const note = $("#lNote").value.trim();
    if(!title || !url) return toast("标题和链接都要填哦");
    if(!/^https?:\/\//i.test(url)) return toast("链接要以 http:// 或 https:// 开头");
    await db.collection("links").add({ title, url, note, createdAt: Date.now() });
    toast("收藏好啦 ♡"); renderFav();
  };
  app.querySelector(".link-list").addEventListener("click", async e=>{
    const del = e.target.closest("[data-del]");
    if(del && confirm("删掉这条收藏？")){
      await db.collection("links").doc(del.dataset.del).delete();
      renderFav();
    }
  });
}

/* ================= Cloudinary 上传 ================= */
function uploadToCloudinary(file, onProgress){
  return new Promise((resolve, reject)=>{
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", cloudinaryConfig.uploadPreset);
    formData.append("folder", "travel-diary");
    const xhr = new XMLHttpRequest();
    xhr.timeout = 60000;
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`);
    if(onProgress) xhr.upload.addEventListener("progress", e=>onProgress(e.loaded, e.total));
    xhr.addEventListener("load", ()=>{
      try{
        const data = JSON.parse(xhr.responseText || "{}");
        if(xhr.status >= 200 && xhr.status < 300 && data.secure_url) resolve(data.secure_url);
        else reject(new Error(data.error?.message || "cloudinary upload failed"));
      }catch(err){ reject(err); }
    });
    xhr.addEventListener("error", ()=>reject(new Error("网络错误")));
    xhr.addEventListener("timeout", ()=>reject(new Error("上传超时")));
    xhr.send(formData);
  });
}
